<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Login Page</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				background-color: #f2f2f2;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
			}

			.login-container {
				background-color: white;
				padding: 30px;
				border-radius: 8px;
				box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
				width: 300px;
			}

			.login-container h2 {
				text-align: center;
				margin-bottom: 20px;
			}

			.login-container input[type="text"],
			.login-container input[type="password"] {
				width: 100%;
				padding: 10px;
				margin: 8px 0;
				border: 1px solid #ccc;
				border-radius: 4px;
			}

			.login-container button {
				width: 100%;
				padding: 10px;
				background-color: #007bff;
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
			}

			.login-container button:hover {
				background-color: #0056b3;
			}

			.back-link {
				position: absolute;
				top: 20px;
				left: 20px;
				text-decoration: none;
				color: #007bff;
				font-weight: bold;
			}
			.back-link:hover {
				text-decoration: underline;
			}
		</style>
	</head>

	<body>
		<a href="index.html" class="back-link">&larr; Back to Home</a>
		<div class="login-container">
			<h2>Login</h2>
			<form id="login-form">
				<input
					type="text"
					id="username"
					placeholder="Username"
					required
				/>
				<input
					type="password"
					id="password"
					placeholder="Password"
					required
				/>
				<button type="submit">Log In</button>
			</form>
		</div>

		<script>
			document.addEventListener("DOMContentLoaded", () => {
				const loginForm = document.getElementById("login-form");
				if (loginForm) {
					loginForm.addEventListener("submit", handleLogin);
				}

				// Load saved credentials for development convenience
				const savedUser = localStorage.getItem("devUsername");
				const savedPass = localStorage.getItem("devPassword");
				if (savedUser && savedPass) {
					document.getElementById("username").value = savedUser;
					document.getElementById("password").value = savedPass;
				}
			});

			/**
			 * Handles the login form submission.
			 * @param {Event} event - The form submission event.
			 */
			function handleLogin(event) {
				event.preventDefault(); // Stop form from submitting

				const username = document
					.getElementById("username")
					.value.trim();
				const password = document.getElementById("password").value;

				if (username === "admin" && password === "admin") {
					localStorage.setItem("devUsername", username);
					localStorage.setItem("devPassword", password);
					window.location.href = "./dashboard/hub.html";
				} else {
					alert("Login failed: Invalid username or password.");
					window.location.href = "index.html";
				}
			}
		</script>
	</body>
</html>
