<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Authorised access to the Fa Da Pte Ltd tools dashboard."
		/>
		<title>Dashboard Login | Fa Da Pte Ltd</title>
		<link rel="stylesheet" href="css/dashboard-styles.css" />
		<script src="js/auth.js"></script>
	</head>

	<body class="auth-page">
		<a href="index.html" class="back-link">&larr; Back to Home</a>
		<main class="login-container panel">
			<h1>Dashboard Login</h1>
			<form id="login-form">
				<label class="field-label" for="username">Username</label>
				<input
					type="text"
					id="username"
					class="field-input"
					autocomplete="username"
					required
				/>
				<label class="field-label" for="password">Password</label>
				<input
					type="password"
					id="password"
					class="field-input"
					autocomplete="current-password"
					aria-describedby="login-message"
					required
				/>
				<button class="primary-button login-button" type="submit">
					Log In
				</button>
			</form>
			<p id="login-message" class="form-message" role="alert"></p>
		</main>

		<script>
			document.addEventListener("DOMContentLoaded", () => {
				if (window.FadaAuth.isAuthenticated()) {
					window.location.replace("./dashboard/hub.html");
					return;
				}

				const loginForm = document.getElementById("login-form");
				loginForm.addEventListener("submit", handleLogin);
			});

			/**
			 * Handles the login form submission.
			 * @param {Event} event - The form submission event.
			 */
			function handleLogin(event) {
				event.preventDefault();

				const username = document
					.getElementById("username")
					.value.trim();
				const passwordInput = document.getElementById("password");
				const message = document.getElementById("login-message");

				if (window.FadaAuth.login(username, passwordInput.value)) {
					window.location.href = "./dashboard/hub.html";
				} else {
					message.textContent = "Invalid username or password.";
					passwordInput.value = "";
					passwordInput.focus();
				}
			}
		</script>
	</body>
</html>
