<!doctype html>
<html lang="en" class="auth-check">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Fa Da Pte Ltd monthly payroll input and fare calculation tool."
		/>
		<title>Payroll Calculator | Fa Da Pte Ltd</title>
		<link rel="stylesheet" href="../css/dashboard-styles.css" />
		<script src="../js/auth.js"></script>
		<script>
			window.FadaAuth.startGuard("../login.html");
		</script>
	</head>
	<body>
		<main class="page-shell">
			<nav class="nav-links" aria-label="Dashboard navigation">
				<a href="../index.html">&larr; Back to Home</a>
				<a href="hub.html">&uarr; Back to Menu</a>
				<button
					type="button"
					class="link-button logout-button"
					onclick="window.FadaAuth.logout('../login.html')"
				>
					Log out
				</button>
			</nav>

			<h1 class="page-heading">Payroll Input Dashboard</h1>
			<p class="page-intro">
				Enter the employee's daily hours to calculate the monthly payslip.
			</p>

			<section class="panel payroll-panel">
				<form id="payroll-form" onsubmit="return handleSubmit(event);">
					<div class="form-grid">
						<div class="full-width">
							<label class="field-label" for="month">
								Select Month and Year
							</label>
							<input
								type="month"
								id="month"
								name="month"
								class="field-input"
								min="2020-01"
								required
								onchange="generateTable()"
							/>
							<p
								id="holidayStatus"
								class="holiday-status"
								role="status"
								aria-live="polite"
							>
								Select a month to load official Singapore public holidays.
							</p>
						</div>

						<div class="full-width">
							<label class="field-label" for="name">Employee Name</label>
							<input
								type="text"
								id="name"
								name="name"
								class="field-input"
								autocomplete="name"
								required
							/>
						</div>

						<div>
							<label class="field-label" for="basicPay">
								Basic Pay (daily rate)
							</label>
							<input
								type="number"
								id="basicPay"
								name="basicPay"
								class="field-input"
								inputmode="decimal"
								min="0"
								step="0.01"
								required
							/>
						</div>

						<div>
							<label class="field-label" for="otPay">
								OT Pay (hourly rate)
							</label>
							<input
								type="number"
								id="otPay"
								name="otPay"
								class="field-input"
								inputmode="decimal"
								min="0"
								step="0.01"
								required
							/>
						</div>
					</div>

					<div id="dayTableContainer"></div>

					<div class="form-actions">
						<button
							type="submit"
							id="submitButton"
							class="primary-button submit-button"
							disabled
						>
							Calculate Payslip
						</button>
					</div>
				</form>
			</section>

			<div
				id="resultContainer"
				class="result-container"
				aria-live="polite"
			></div>
		</main>

		<script src="../js/payrollinput.js"></script>
		<script src="../js/payrollcalculation.js"></script>
	</body>
</html>
